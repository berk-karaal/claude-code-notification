version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: notification
    main: ./cmd/claude-code-notification
    binary: notification
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: notification
    name_template: "notification_{{ .Os }}_{{ .Arch }}"
    format: tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: berk-karaal
    name: claude-code-notification
